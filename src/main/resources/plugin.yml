name: PandaGPT
version: '3.2.0'
main: cn.panda.pandagpt.ChatGPTIntegration
api-version: '26.3'
softdepend: [Vault, PlaceholderAPI, LuckPerms, WorldGuard, GriefPrevention, Towny, Lands, Essentials, CoreProtect, mcMMO, AuraSkills, Citizens, Shopkeepers, Quests, BentoBox, ItemsAdder, Oraxen, Jobs, Multiverse-Core]
description: 只需在聊天中说 panda 的 Minecraft Agent 助手：能看、能记、会查资料，也会在合适的时候安静地提醒你。
website: https://github.com/obsidianplusplus/PandaGPT
commands:
  pandaadmin:
    description: 重载配置、查看状态或清除全部会话。
    usage: /pandaadmin <reload|status|clearchat>
    permission: pandagpt.admin
permissions:
  pandagpt.use:
    description: 允许向助手提问。
    default: true
  pandagpt.actions:
    description: 允许接收并确认允许列表中的玩家命令。
    default: op
  pandagpt.admin:
    description: 允许管理 PandaGPT。
    default: op
  pandagpt.vision:
    description: 允许生成第一人称射线重建图并向视觉模型提问。
    default: op
  pandagpt.vision.debug:
    description: 允许以私有粒子显示射线命中点。
    default: op
  pandagpt.blockhistory:
    description: 允许 Agent 查询 CoreProtect 方块记录（谁放置或破坏了方块）。
    default: op
